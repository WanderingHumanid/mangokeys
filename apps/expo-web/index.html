<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="MangoKeys, a Manglish to Malayalam keyboard. A character level model that runs entirely in the browser."
    />
    <title>MangoKeys, a Manglish to Malayalam keyboard</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <header class="masthead">
        <h1>MangoKeys</h1>
        <div class="state">
          <span class="status" id="status">loading the model</span>
          <span class="clock" id="clock"></span>
        </div>
      </header>

      <section class="compose" aria-label="What you are writing">
        <textarea
          id="field"
          rows="1"
          spellcheck="false"
          autocapitalize="off"
          autocomplete="off"
          placeholder="Type in Manglish"
          aria-label="Type in Manglish"
        ></textarea>
      </section>

      <section class="keyboard" aria-label="The keyboard">
        <div class="strip" id="strip" role="listbox" aria-label="Suggestions"></div>
        <div class="keys" id="keys"></div>
      </section>

      <section class="results">
        <h2>Measured on the Aksharantar test set</h2>
        <p class="caption">12,451 words the model has never seen.</p>
        <table id="bench-table">
          <thead>
            <tr>
              <th>System</th>
              <th>Top-1</th>
              <th>CER</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <p class="note" id="bench-note"></p>
      </section>

      <footer>
        <p>
          Nothing you type leaves this page. The model runs in your browser
          with WebAssembly.
        </p>
        <nav>
          <a href="https://github.com/WanderingHumanid/mangokeys">the repository</a>
          <a href="https://github.com/WanderingHumanid/mangokeys/releases/latest">the Android app</a>
          <a href="https://github.com/WanderingHumanid/mangokeys/blob/main/REPORT.md">the report</a>
        </nav>
      </footer>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
