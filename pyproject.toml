[project]
name = "mangokeyboard"
version = "0.1.0"
description = "Manglish to Malayalam transliteration with a compact on-device model"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
