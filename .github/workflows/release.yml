name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag of the release, for example v0.01"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install the platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # The key is optional. Without it the release is signed with the debug
      # key, which installs on any phone. The four secrets are described in
      # docs/RELEASING.md.
      - name: Decode the signing key
        id: key
        env:
          KEYSTORE: ${{ secrets.MANGOKEYS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "no signing key, the APK will be signed with the debug key"
            exit 0
          fi
          echo "$KEYSTORE" | base64 --decode > mangokeys.keystore
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the release APK
        working-directory: runtime
        env:
          # The path is always given. When the key was not decoded the file
          # is not there, and the build falls back to the debug key.
          MANGOKEYS_KEYSTORE: ${{ github.workspace }}/mangokeys.keystore
          MANGOKEYS_KEYSTORE_PASSWORD: ${{ secrets.MANGOKEYS_KEYSTORE_PASSWORD }}
          MANGOKEYS_KEY_ALIAS: ${{ secrets.MANGOKEYS_KEY_ALIAS }}
          MANGOKEYS_KEY_PASSWORD: ${{ secrets.MANGOKEYS_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew :app:assembleRelease --console=plain -PversionName="$VERSION"

      - name: Collect the files
        run: |
          mkdir -p dist
          cp apps/android/build/outputs/apk/release/app-release.apk dist/mangokeys-${{ inputs.tag || github.ref_name }}.apk
          cd apps/expo-web && zip -qr ../../dist/mangokeys-web-demo.zip . -x "node_modules/*"
          cd ../..
          ls -lh dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ inputs.tag || github.ref_name }}
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            dist/*.apk
            dist/*.zip
          fail_on_unmatched_files: true
