name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A run of this workflow stops at the first failure, so a broken push is
# reported once and not three times.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the dependencies
        run: pip install -r requirements.txt

      - name: Run the tests
        run: python -m pytest tests -q

  android:
    name: Android tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install the platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run the tests of the Kotlin runtime
        working-directory: runtime
        run: ./gradlew test --console=plain

  web:
    name: Web demo build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the runtime of the browser
        run: npm ci

      - name: Assemble the demo
        run: python -m scripts.build_web --out dist/web

  apk:
    name: Build the APK
    runs-on: ubuntu-latest
    needs: [python, android]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install the platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the release
        working-directory: runtime
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Collect the APK
        run: |
          mkdir -p dist
          cp apps/android/build/outputs/apk/release/app-release.apk dist/mangokeys.apk
          ls -lh dist

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: mangokeys-apk
          path: dist/mangokeys.apk
          retention-days: 14
