data:
  train: data/processed/train_prefix.tsv
  valid: data/processed/valid.tsv
  test: data/processed/test_aksharantar.tsv
  max_src: 48
  max_tgt: 64

model:
  d_model: 256
  n_heads: 4
  d_ff: 512
  n_enc_layers: 4
  n_dec_layers: 4
  dropout: 0.3

train:
  batch_size: 1024
  lr: 0.0007
  warmup_steps: 4000
  epochs: 8
  label_smoothing: 0.1
  grad_clip: 1.0
  seed: 42
  out_dir: runs/ml_prefix
  log_every: 100
  eval_every: 1
  # The training file has tens of millions of rows, so the batches are
  # prepared by more than one process.
  num_workers: 4
