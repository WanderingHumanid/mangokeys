data:
  train: data/processed/subset/train.tsv
  valid: data/processed/subset/valid.tsv
  test: data/processed/subset/test_aksharantar.tsv
  max_src: 48
  max_tgt: 64

model:
  d_model: 256
  n_heads: 4
  d_ff: 512
  n_enc_layers: 4
  n_dec_layers: 4
  dropout: 0.3

train:
  batch_size: 1024
  lr: 0.0007
  warmup_steps: 1000
  epochs: 8
  label_smoothing: 0.1
  grad_clip: 1.0
  seed: 42
  out_dir: runs/subset
  log_every: 25
  eval_every: 2
  num_workers: 6
